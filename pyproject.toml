[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codelens"
version = "0.1.0"
description = "Retrieval-Augmented Code Review Agent with Codebase-Aware Context"
readme = "_template_project/PROJECT_OVERVIEW.md"
requires-python = ">=3.11"
authors = [
    { name = "CodeLens Team" }
]
dependencies = [
    "fastapi>=0.110.0,<0.111.0",
    "uvicorn[standard]>=0.29.0,<0.30.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "gitpython>=3.1.43,<4.0.0",
    "tree-sitter>=0.21.3,<0.22.0",
    "tree-sitter-python>=0.21.0,<0.22.0",
    "tree-sitter-typescript>=0.21.0,<0.22.0",
    "faiss-cpu>=1.8.0,<1.9.0",
    "google-generativeai>=0.5.0,<0.6.0",
    "PyGithub>=2.3.0,<3.0.0",
    "httpx>=0.27.0,<0.28.0",
    "python-dotenv>=1.0.1,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<0.24.0",
    "ruff>=0.3.5,<0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
